{% extends 'layout.html' %}

{% block title %}Login - StudyLib{% endblock %}

{% block content %}
<div class="container py-5 archive-page archive-page-auth" aria-label="Login page">
    <span class="archive-illustration illustration-compass" aria-hidden="true"></span>
    <span class="archive-illustration illustration-sextant" aria-hidden="true"></span>
    <span class="archive-illustration illustration-books" aria-hidden="true"></span>
    <span class="archive-illustration illustration-scholar" aria-hidden="true"></span>
    <span class="archive-illustration illustration-victorian-man" aria-hidden="true"></span>
    <span class="archive-illustration illustration-candlestick" aria-hidden="true"></span>
    <span class="archive-illustration illustration-telescope" aria-hidden="true"></span>
    <span class="archive-illustration illustration-hourglass" aria-hidden="true"></span>
    <span class="archive-illustration illustration-armillary-sphere" aria-hidden="true"></span>
    <span class="archive-illustration illustration-oil-lamp" aria-hidden="true"></span>
    
    <div class="archive-content">
        <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0">Login</h4>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" name="username" class="form-control" required maxlength="255" aria-describedby="usernameHelp">
                            <div id="usernameHelp" class="form-text">Enter your account username.</div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" required maxlength="255" aria-describedby="passwordHelp">
                            <div id="passwordHelp" class="form-text">Enter your account password.</div>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                        <div class="mt-3 text-center">
                            <a href="{{ url_for('auth.forgot_password') }}" class="text-muted small">Forgot password?</a>
                        </div>
                        <hr>
                        <div class="d-grid gap-2">
                            <a href="{{ url_for('auth.google_login') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-google"></i> Sign in with Google
                            </a>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-muted">
                    Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>.
                </div>
            </div>
        </div>
    </div>
    </div>
</div>
{% endblock %}
